<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d12">
  <meta name="description" content="Повтор — твой личный дневник подтягиваний, отжиманий и упражнений на пресс. Каждый подход имеет значение. Работает без интернета.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Повтор">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Повтор — дневник упражнений</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="app-shell" id="app" data-theme="mint">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <header class="app-header">
      <a class="brand" href="#today" aria-label="Повтор — на главную">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 15.5 15.5 5M8.5 19 19 8.5M4 12l8 8M12 4l8 8M3 17l4 4M17 3l4 4"/></svg></span>
        <span class="brand-copy"><strong>Повтор<span class="brand-dot">.</span></strong><small>ДНЕВНИК УПРАЖНЕНИЙ</small></span>
      </a>
      <div class="header-actions">
        <button class="header-icon" type="button" data-action="timer-open" aria-label="Таймер отдыха"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="14" r="8"/><path d="M12 10v4l2 2M9 2h6m-3 0v4m6 1 2-2"/></svg></button>
        <button class="header-icon" type="button" data-action="settings" aria-label="Настройки"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m9 3-1 3-3 .7-1.5 2.6L5 12l-1.5 2.7L5 17.3l3 .7 1 3h6l1-3 3-.7 1.5-2.6L19 12l1.5-2.7L19 6.7 16 6l-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </header>
    <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
    <main class="screen" id="main" tabindex="-1"></main>
    <aside id="rest-dock" class="rest-dock card" aria-label="Таймер отдыха" hidden></aside>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <a class="nav-item" href="#today" data-screen="today" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2Z"/></svg></span><span>Сегодня</span></a>
      <a class="nav-item" href="#history" data-screen="history"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Zm0 0H3m4 16a2 2 0 0 1 0-4h12M9 8h6M9 11h4"/></svg></span><span>История</span></a>
      <a class="nav-item" href="#progress" data-screen="progress"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16M8 15v-4m4 4V7m4 8V5"/></svg></span><span>Прогресс</span></a>
    </nav>
    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="header-icon sheet-close" type="button" data-action="close-sheet" aria-label="Закрыть"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      <div id="sheet-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <noscript><div class="card noscript">Для работы дневника нужен JavaScript. Пожалуйста, включи его в настройках браузера.</div></noscript>
  </div>
</body>
</html>
